{% extends "base.html" %}
{% block title %}{{ title }} - ExamGen{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger">
            <div class="card-body">
                <h1 class="h4">{{ title }}</h1>
                <p class="mb-2"><strong>{{ what }}</strong></p>
                {% if warning %}<p class="text-muted">{{ warning }}</p>{% endif %}
                <p class="mb-0">This cannot be undone.</p>
                <form method="post" class="d-flex gap-2 mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
