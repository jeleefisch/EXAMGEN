{% extends "base.html" %}
{% block title %}{% if object %}Edit{% else %}Create{% endif %} Bank - ExamGen{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <h1 class="h4 mb-3">{% if object %}Edit{% else %}Create{% endif %} Question Bank</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" href="{% url 'banks:bank_list' %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
