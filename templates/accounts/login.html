{% extends "base.html" %}
{% block title %}Login - ExamGen{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Faculty Login</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
                    <button class="btn btn-primary w-100" type="submit">Login</button>
                </form>
                <p class="mt-3 mb-0 text-center">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
