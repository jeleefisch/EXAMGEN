{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">My profile</h1>
<form method="post" class="card card-body" style="max-width: 520px;">
  {% csrf_token %}
  <p class="text-muted mb-3">Signed in as <strong>{{ user.username }}</strong></p>
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button class="btn btn-primary" type="submit">Save</button>
</form>
{% endblock %}
